# Backup only: if LeftoverIQ.xcodeproj ever fails to open, install XcodeGen
# (brew install xcodegen) and run `xcodegen` in this folder to regenerate it.
name: LeftoverIQ
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  LeftoverIQ:
    type: application
    platform: iOS
    sources: [LeftoverIQ]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourcompany.leftoveriq
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: LeftoverIQ
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.food-and-drink
        INFOPLIST_KEY_NSCameraUsageDescription: "LeftoverIQ uses the camera so you can photograph ingredients and get recipe ideas. Photos are analyzed on your device."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
